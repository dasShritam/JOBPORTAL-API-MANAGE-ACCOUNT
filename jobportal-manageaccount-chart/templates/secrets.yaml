apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: {{ .Values.secrets.manageaccount.name }}
      namespace: {{ .Values.app.namespace }}
    type: Opaque
    data:
      MANAGE_AC_PORT: {{ .Values.secrets.manageaccount.MANAGE_AC_PORT }}
      ENVIRONMENT: {{ .Values.secrets.manageaccount.ENVIRONMENT }}
      APP_CONNECTIONSTRING_MONGO: {{ .Values.secrets.manageaccount.APP_CONNECTIONSTRING_MONGO }}
      BLOB_AC_NAME: {{ .Values.secrets.manageaccount.BLOB_AC_NAME }}
      BLOB_AC_KEY: {{ .Values.secrets.manageaccount.BLOB_AC_KEY }}
      BLOB_CONNECTION_STRING: {{ .Values.secrets.manageaccount.BLOB_CONNECTION_STRING }}
      BLOB_LOGGER_CONTAINER: {{ .Values.secrets.manageaccount.BLOB_LOGGER_CONTAINER }}
      BLOB_COMMON_CONTAINER: {{ .Values.secrets.manageaccount.BLOB_COMMON_CONTAINER }}
      BLOB_EMPLOYER_CONTAINER: {{ .Values.secrets.manageaccount.BLOB_EMPLOYER_CONTAINER }}
      BLOB_JOBSEEKER_CONTAINER: {{ .Values.secrets.manageaccount.BLOB_JOBSEEKER_CONTAINER }}
      BLOB_LINK_LIVE_INMIN: {{ .Values.secrets.manageaccount.BLOB_LINK_LIVE_INMIN }}
      LOG_LEVEL: {{ .Values.secrets.manageaccount.LOG_LEVEL }}
      MAX_PWD_HISTORY: {{ .Values.secrets.manageaccount.MAX_PWD_HISTORY }}
      VERIFY_LINK_EXPIRY_DAY: {{ .Values.secrets.manageaccount.VERIFY_LINK_EXPIRY_DAY }}
      MAIL_SVC_HOST: {{ .Values.secrets.manageaccount.MAIL_SVC_HOST }}
      MAIL_SVC_PORT: {{ .Values.secrets.manageaccount.MAIL_SVC_PORT }}
      MAIL_SVC_USERNAME: {{ .Values.secrets.manageaccount.MAIL_SVC_USERNAME }}
      MAIL_SVC_PASSWORD: {{ .Values.secrets.manageaccount.MAIL_SVC_PASSWORD }}
      MAIL_SVC_FROM_NAME: {{ .Values.secrets.manageaccount.MAIL_SVC_FROM_NAME }}
      MAIL_SVC_FROM: {{ .Values.secrets.manageaccount.MAIL_SVC_FROM }}
      EMAIL_TEMP_CONTACT_US: {{ .Values.secrets.manageaccount.VERIFY_LINK_EXPIRY_DAY }}
      EMAIL_TEMP_EMAIL: {{ .Values.secrets.manageaccount.VERIFY_LINK_EXPIRY_DAY }}
      UI_URL: {{ .Values.secrets.manageaccount.UI_URL }}
